name: TCI Tests

# Regression gate for the 6 TCI unit tests across Linux, macOS, and Windows.
# Triggers on the TCI port branch and on any PR targeting master.

on:
  push:
    branches:
      - feat/tci-port-2.3.1
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Linux: ubuntu-24.04, native WASAPI-less build.
  # Dependency list copied verbatim from cmake-linux.yml test-application job
  # ("Install common packages" + ubuntu-24.04 "Install version-specific packages").
  #
  # Builds with Clang, not the runner's default GCC. This is not a preference --
  # GCC cannot compile this project at all since upstream #1440 mandated C++20.
  # freedv-backend vendors websocketpp 0.8.2, whose logger/basic.hpp declares
  # ctors/dtor as `basic<concurrency,names>(...)` / `~basic<concurrency,names>()`;
  # C++20 bans the template-id form (CWG2237/P1787) and GCC enforces it, giving 7
  # parse errors. Verified with gcc 13.4: 0 errors at -std=c++17, 7 at -std=c++20
  # and above, unaffected by -fpermissive or gnu++ extensions. It is not specific
  # to TCI code -- the backend's own SocketIoClient.cpp fails identically.
  #
  # Clang still accepts the construct, which is why upstream never hits this:
  # cmake-linux.yml installs LLVM and builds with clang++-21. Verified the
  # runner's stock clang 18.1.3 compiles both the websocketpp config header and
  # SocketIoClient.cpp with 0 errors at C++17/20/23, so there is no need to
  # replicate upstream's LLVM 21 install here.
  # ---------------------------------------------------------------------------
  ubuntu:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install rtkit for RT threading
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install dbus-x11 rtkit libdbus-1-dev polkitd
          sudo sed -i 's/no/yes/g' /usr/share/polkit-1/actions/org.freedesktop.RealtimeKit1.policy
          sudo systemctl restart polkit

      - name: Install common packages
        shell: bash
        run: |
          sudo apt-get install libpulse-dev libspeexdsp-dev sox git portaudio19-dev libhamlib-dev libasound2-dev libao-dev libgsm1-dev libsndfile-dev xvfb pulseaudio-utils metacity at-spi2-core libebur128-dev python3 python3-dev python3-venv

      - name: Install version-specific packages (ubuntu-24.04)
        shell: bash
        run: |
          sudo apt-get install libwxgtk3.2-dev pipewire pipewire-pulse wireplumber clang

      - name: Configure
        run: |
          clang++ --version
          cmake -B build_linux \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNITTEST=ON \
            -DUSE_NATIVE_AUDIO=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build TCI test targets
        run: |
          cmake --build build_linux --target \
            TciProtocolTest \
            TciMoxGateTest \
            TciReconnectTest \
            TciWebSocketClientTest \
            TciAudioFrameTest \
            TciDeviceNamingTest \
            -j$(nproc)

      - name: Run TCI tests
        working-directory: build_linux
        run: ctest -R '^(audio_Tci|rig_control_Tci)' --output-on-failure -V

  # ---------------------------------------------------------------------------
  # macOS: macos-latest (ARM64).
  # Dependency list copied verbatim from cmake-macos.yml test job
  # ("Install needed packages" step).
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install needed packages
        run: |
          brew install automake libtool numpy sox wxwidgets speexdsp portaudio libsndfile hamlib libebur128

      - name: Configure
        run: cmake -B build_osx -DCMAKE_BUILD_TYPE=Debug -DUNITTEST=ON -DUSE_NATIVE_AUDIO=OFF

      - name: Build TCI test targets
        run: |
          cmake --build build_osx --target \
            TciProtocolTest \
            TciMoxGateTest \
            TciReconnectTest \
            TciWebSocketClientTest \
            TciAudioFrameTest \
            TciDeviceNamingTest \
            -j$(sysctl -n hw.ncpu)

      - name: Run TCI tests
        working-directory: build_osx
        run: ctest -R '^(audio_Tci|rig_control_Tci)' --output-on-failure -V

  # ---------------------------------------------------------------------------
  # Windows: windows-latest, MSYS2/MinGW64 toolchain.
  # Provides autotools + portaudio headers without cross-compilation.
  # The existing cmake-windows.yml cross-compiles from Linux; this is the first
  # native Windows build lane in the project.
  #
  # NOTE: mingw-w64-x86_64-hamlib was dropped from the MSYS2 repos, which broke
  # this job at the pacman step ("target not found"). It is deliberately not in
  # the install list below -- with no system Hamlib present, the top-level
  # CMakeLists.txt find_path/find_library probe fails and falls through to
  # cmake/BuildHamlib.cmake, which builds Hamlib from source (applying
  # cmake/hamlib-windows.patch). That costs build time but needs no pinned
  # third-party package. Re-add the package here if MSYS2 ever restores it.
  #
  # TciWebSocketClientTest exits 0 on Windows (no-op main guarded by
  # #if !defined(_WIN32)) -- counted as a pass by ctest.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MSYS2 with MinGW64 toolchain and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-libebur128
            autoconf
            automake
            libtool
            make

      - name: Configure
        run: |
          cmake -B build_windows \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNITTEST=ON \
            -DUSE_NATIVE_AUDIO=OFF \
            -DUSE_STATIC_PORTAUDIO=OFF \
            -DUSE_STATIC_SNDFILE=OFF \
            -DUSE_STATIC_SPEEXDSP=OFF \
            -DBOOTSTRAP_WXWIDGETS=OFF \
            .

      - name: Build TCI test targets
        run: |
          cmake --build build_windows --target \
            TciProtocolTest \
            TciMoxGateTest \
            TciReconnectTest \
            TciWebSocketClientTest \
            TciAudioFrameTest \
            TciDeviceNamingTest \
            -j$(nproc)

      - name: Run TCI tests
        working-directory: build_windows
        run: ctest -R '^(audio_Tci|rig_control_Tci)' --output-on-failure -V
