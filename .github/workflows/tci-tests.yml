name: TCI Tests

# Regression gate for the 6 TCI unit tests across Linux, macOS, and Windows.
# Triggers on the TCI port branch and on any PR targeting master.

on:
  push:
    branches:
      - feat/tci-port-2.3.1
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Linux: ubuntu-24.04, native WASAPI-less build.
  # Dependency list copied verbatim from cmake-linux.yml test-application job
  # ("Install common packages" + ubuntu-24.04 "Install version-specific packages").
  #
  # Builds with Clang, not the runner's default GCC. This is not a preference --
  # GCC cannot compile this project at all since upstream #1440 mandated C++20.
  # freedv-backend vendors websocketpp 0.8.2, whose logger/basic.hpp declares
  # ctors/dtor as `basic<concurrency,names>(...)` / `~basic<concurrency,names>()`;
  # C++20 bans the template-id form (CWG2237/P1787) and GCC enforces it, giving 7
  # parse errors. Verified with gcc 13.4: 0 errors at -std=c++17, 7 at -std=c++20
  # and above, unaffected by -fpermissive or gnu++ extensions. It is not specific
  # to TCI code -- the backend's own SocketIoClient.cpp fails identically.
  #
  # Clang still accepts the construct, which is why upstream never hits this:
  # cmake-linux.yml installs LLVM and builds with clang++-21. Verified the
  # runner's stock clang 18.1.3 compiles both the websocketpp config header and
  # SocketIoClient.cpp with 0 errors at C++17/20/23, so there is no need to
  # replicate upstream's LLVM 21 install here.
  # ---------------------------------------------------------------------------
  ubuntu:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install rtkit for RT threading
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install dbus-x11 rtkit libdbus-1-dev polkitd
          sudo sed -i 's/no/yes/g' /usr/share/polkit-1/actions/org.freedesktop.RealtimeKit1.policy
          sudo systemctl restart polkit

      - name: Install common packages
        shell: bash
        run: |
          sudo apt-get install libpulse-dev libspeexdsp-dev sox git portaudio19-dev libhamlib-dev libasound2-dev libao-dev libgsm1-dev libsndfile-dev xvfb pulseaudio-utils metacity at-spi2-core libebur128-dev python3 python3-dev python3-venv

      - name: Install version-specific packages (ubuntu-24.04)
        shell: bash
        run: |
          sudo apt-get install libwxgtk3.2-dev pipewire pipewire-pulse wireplumber clang

      - name: Configure
        run: |
          clang++ --version
          cmake -B build_linux \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNITTEST=ON \
            -DUSE_NATIVE_AUDIO=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build TCI test targets
        run: |
          cmake --build build_linux --target \
            TciProtocolTest \
            TciMoxGateTest \
            TciReconnectTest \
            TciWebSocketClientTest \
            TciAudioFrameTest \
            TciDeviceNamingTest \
            -j$(nproc)

      - name: Run TCI tests
        working-directory: build_linux
        run: ctest -R '^(audio_Tci|rig_control_Tci)' --output-on-failure -V

  # ---------------------------------------------------------------------------
  # macOS: macos-latest (ARM64).
  # Dependency list copied verbatim from cmake-macos.yml test job
  # ("Install needed packages" step).
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install needed packages
        run: |
          brew install automake libtool numpy sox wxwidgets speexdsp portaudio libsndfile hamlib libebur128

      - name: Configure
        run: cmake -B build_osx -DCMAKE_BUILD_TYPE=Debug -DUNITTEST=ON -DUSE_NATIVE_AUDIO=OFF

      - name: Build TCI test targets
        run: |
          cmake --build build_osx --target \
            TciProtocolTest \
            TciMoxGateTest \
            TciReconnectTest \
            TciWebSocketClientTest \
            TciAudioFrameTest \
            TciDeviceNamingTest \
            -j$(sysctl -n hw.ncpu)

      - name: Run TCI tests
        working-directory: build_osx
        run: ctest -R '^(audio_Tci|rig_control_Tci)' --output-on-failure -V

  # ---------------------------------------------------------------------------
  # Windows: windows-latest, MSYS2/CLANG64 toolchain.
  # Provides autotools + portaudio headers without cross-compilation.
  # The existing cmake-windows.yml cross-compiles from Linux; this is the first
  # native Windows build lane in the project. It has never yet gone green.
  #
  # CLANG64 rather than MINGW64, for two independent reasons:
  #
  #  1. MINGW64's toolchain is GCC, which cannot build this project at all --
  #     see the ubuntu job above. websocketpp 0.8.2 does not parse under GCC at
  #     C++20, and upstream has mandated C++20 since #1440. CLANG64 gives clang,
  #     which accepts it.
  #  2. wxWidgets 3.3 is not published for the mingw64 repo. CMakeLists.txt now
  #     pins WXWIDGETS_VERSION 3.3.3 (cmake/BuildWxWidgets.cmake:1), and MSYS2
  #     ships mingw-w64-clang-x86_64-wxwidgets3.3 at exactly 3.3.3 in clang64
  #     (also in ucrt64). Installing it lets -DBOOTSTRAP_WXWIDGETS=OFF actually
  #     be honoured; previously find_package(wxWidgets) failed, CMake fell back
  #     to cloning wxWidgets, and the populate/patch step errored out.
  #
  # NOTE: hamlib was dropped from the MSYS2 repos entirely (no build in any
  # repo), which is what broke this job at the pacman step ("target not found").
  # It is deliberately absent from the install list -- with no system Hamlib,
  # the CMakeLists.txt find_path/find_library probe fails and falls through to
  # cmake/BuildHamlib.cmake, which builds it from source (applying
  # cmake/hamlib-windows.patch). That costs build time but needs no pinned
  # third-party package. Re-add it here if MSYS2 ever restores it.
  #
  # TciWebSocketClientTest exits 0 on Windows (no-op main guarded by
  # #if !defined(_WIN32)) -- counted as a pass by ctest.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MSYS2 with CLANG64 toolchain and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-wxwidgets3.3
            mingw-w64-clang-x86_64-portaudio
            mingw-w64-clang-x86_64-libsndfile
            mingw-w64-clang-x86_64-speexdsp
            mingw-w64-clang-x86_64-libebur128
            autoconf
            automake
            libtool
            make

      - name: Configure
        run: |
          clang++ --version
          # "Unix Makefiles", not Ninja and not "MinGW Makefiles":
          #   * Ninja breaks on cmake/BuildHamlib.cmake, which uses
          #     BUILD_COMMAND $(MAKE). That is a Make-only jobserver construct;
          #     under Ninja it lands in build.ninja as a literal $ and errors with
          #     "bad $-escape (literal $ must be written as $$)". Since MSYS2 has
          #     no hamlib package, that ExternalProject always runs here.
          #   * "MinGW Makefiles" needs mingw32-make, which the CLANG64 toolchain
          #     group does not ship (clang/lld based).
          # The msys "make" in the install list drives Unix Makefiles, and is also
          # what the autotools-based ExternalProjects expect.
          cmake -B build_windows \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNITTEST=ON \
            -DUSE_NATIVE_AUDIO=OFF \
            -DUSE_STATIC_PORTAUDIO=OFF \
            -DUSE_STATIC_SNDFILE=OFF \
            -DUSE_STATIC_SPEEXDSP=OFF \
            -DBOOTSTRAP_WXWIDGETS=OFF \
            .

      - name: Build TCI test targets
        run: |
          cmake --build build_windows --target \
            TciProtocolTest \
            TciMoxGateTest \
            TciReconnectTest \
            TciWebSocketClientTest \
            TciAudioFrameTest \
            TciDeviceNamingTest \
            -j$(nproc)

      - name: Run TCI tests
        working-directory: build_windows
        run: ctest -R '^(audio_Tci|rig_control_Tci)' --output-on-failure -V
